# Исполнитель (раннер) с установленным Docker
image: docker:24.0.5

services:
  - docker:24.0.5-dind

# Этапы, которые будет проходить проект
stages:
  - test
  - build

# ----------------------------------------------------
# ШАГ 1: Запуск тестов
# ----------------------------------------------------
run_tests:
  stage: test
  image: python:3.10-slim
  script:
    - pip install -r requirements.txt
    - pytest

# ----------------------------------------------------
# ШАГ 2: Сборка и отправка Docker-образа в GitLab Registry
# ----------------------------------------------------
build_image:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest